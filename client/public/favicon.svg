<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Gradient (Navy/Charcoal Blue to Dark Indigo) -->
    <linearGradient id="hbThemeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Warm Amber Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle Frame -->
  <rect width="512" height="512" rx="128" fill="url(#hbThemeGradient)" stroke="#334155" stroke-width="4"/>

  <!-- Icon Elements Group -->
  <g filter="url(#softGlow)">
    <!-- Hotel Building Silhouette (Clean White) -->
    <path d="M140 420V160c0-13.3 10.7-24 24-24h184c13.3 0 24 10.7 24 24v260c0 6.6-5.4 12-12 12h-40v-84c0-13.3-10.7-24-24-24h-72c-13.3 0-24 10.7-24 24v84h-48c-6.6 0-12-5.4-12-12z" fill="#FFFFFF"/>

    <!-- Hotel Glass Windows (Amber/Gold Accent Tint) -->
    <rect x="180" y="176" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>
    <rect x="238" y="176" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>
    <rect x="296" y="176" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>

    <rect x="180" y="236" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>
    <rect x="238" y="236" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>
    <rect x="296" y="236" width="36" height="36" rx="6" fill="#F59E0B" fill-opacity="0.85"/>

    <!-- Main Entrance Gate -->
    <path d="M240 432v-72h32v72h-32z" fill="#0F172A"/>

    <!-- Gold Luxury Bed & Booking Badge Emblem (Top Right) -->
    <g transform="translate(310, 50)">
      <circle cx="55" cy="55" r="50" fill="url(#goldAccent)"/>
      <!-- Bed/Room Vector inside Gold Circle -->
      <path d="M30 68V42c0-3.3 2.7-6 6-6h38c3.3 0 6 2.7 6 6v26M26 68h58M34 52h14v10H34z" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Star Rating Accent (Top Left) -->
    <path d="M152 72l7.2 14.6 16.1 2.3-11.6 11.3 2.7 16-14.4-7.6-14.4 7.6 2.7-16-11.6-11.3 16.1-2.3z" fill="url(#goldAccent)"/>
  </g>
</svg>
